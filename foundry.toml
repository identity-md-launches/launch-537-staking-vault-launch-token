# Foundry configuration for the launch-token staking vault.
#
# Everything needed to build and test is vendored under lib/ as ordinary files, so the project
# compiles offline once solc 0.8.26 is in the local Foundry cache. No ffi, no filesystem
# permissions, no external compiler binary.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Deterministic creation code: no metadata hash appended, so the attested bytecode depends only on
# the sources and the compiler settings, not on file paths.
bytecode_hash = "none"

ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 48
fail_on_revert = false

[lint]
# The vault is a time lock and a per-second stream: comparing block.timestamp is its purpose.
# A builder can shift a timestamp by seconds, which is documented in the README.
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
